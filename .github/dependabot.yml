version: 2
updates:
  # Keep npm dependencies up to date
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    # Limit the number of open pull requests to avoid noise
    open-pull-requests-limit: 10
    # Cooldown before Dependabot opens a PR for a new release. Majors get a
    # much longer cooldown so transient/yanked releases don't trigger a PR
    # we'd otherwise ignore anyway (see the ignore block below).
    cooldown:
      default-days: 5
      semver-major-days: 60
    # Ignore major updates to avoid breaking changes unless reviewed manually.
    # Explicit ceilings additionally keep the Angular 21 platform coherent if
    # that blanket rule is loosened. Re-derived 2026-10-21 from the final graph:
    # Angular tooling and SDS must remain below 22; Nx below 23; build-angular
    # and ng-packagr require TypeScript >=5.9 <6.0; core admits zone.js ~0.15
    # or ~0.16.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@angular/*'
        versions: ['>= 22.0.0']
      - dependency-name: '@angular-devkit/*'
        versions: ['>= 22.0.0']
      - dependency-name: 'angular-eslint'
        versions: ['>= 22.0.0']
      - dependency-name: 'ng-packagr'
        versions: ['>= 22.0.0']
      - dependency-name: '@gsa-sam/*'
        versions: ['>= 22.0.0']
      - dependency-name: 'typescript'
        versions: ['>= 6.0.0']
      - dependency-name: 'zone.js'
        versions: ['>= 0.17.0']
      - dependency-name: '@nx/*'
        versions: ['>= 23.0.0']
      - dependency-name: 'nx'
        versions: ['>= 23.0.0']
    # Group minor/patch updates by update-type to match the fleet convention
    # (ngx-uswds-icons, sam-styles, sam-ui-elements, sam-design-system). Majors
    # stay ungrouped and human-gated via the ignore block above.
    groups:
      minor:
        patterns:
          - '*'
        update-types:
          - 'minor'
      patch:
        patterns:
          - '*'
        update-types:
          - 'patch'
    # Labels to apply to npm PRs
    labels:
      - 'dependencies'
      - 'npm'

  # Keep GitHub Actions up to date
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 5
    # Group minor/patch action bumps into a single PR to match the fleet
    # convention; majors stay ungrouped and human-gated.
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    # Labels to apply to GitHub Actions PRs
    labels:
      - 'dependencies'
      - 'github-actions'
