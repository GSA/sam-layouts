name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'

    steps:
      # Enforce the 100%-signed-commits policy before enabling auto-merge, and
      # convert GitHub's intermittently-unsigned Dependabot commits (PR #99
      # commit efefa12d: authored by dependabot[bot], verification.verified ==
      # false, reason "unsigned") from a noisy fetch-metadata failure into a
      # clean skip. Without this gate, fetch-metadata below calls core.setFailed
      # on an unsigned commit (verified_commits.ts getMessage() returns false ->
      # main.ts setFailed), turning the job red.
      #
      # FAILS CLOSED: any gh/jq error or an empty commit list aborts the job
      # (set -euo pipefail), so an API failure is never mistaken for "signed".
      # all-signed=false -> the steps below are skipped and the "Cancel
      # auto-merge" step below revokes any auto-merge a previous signed run
      # enabled, so an unsigned head cannot reach main via this workflow.
      - name: Require every commit to carry a verified signature
        id: signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          commits="$(
            gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/commits" \
              --jq '.[] | {sha: .sha, verified: (.commit.verification.verified // false)}' | jq -s '.'
          )"

          count="$(jq 'length' <<<"$commits")"
          if [ "$count" -eq 0 ]; then
            echo "::error::No commits returned for PR #${PR_NUMBER}; refusing to auto-merge."
            exit 1
          fi

          unsigned="$(jq -r '[.[] | select(.verified != true) | .sha] | join(" ")' <<<"$commits")"
          if [ -n "$unsigned" ]; then
            echo "::notice::PR #${PR_NUMBER} has unsigned commit(s): ${unsigned}. Skipping auto-merge; a human must review. (GitHub occasionally leaves Dependabot commits unsigned; this is GitHub-side.)"
            echo "all-signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Verified ${count} commit(s); all carry a verified signature."
          echo "all-signed=true" >> "$GITHUB_OUTPUT"

      # GitHub persists the auto-merge setting across pushes, so skipping the
      # steps below is not enough on its own: a signed push could have enabled
      # auto-merge, and a later unsigned push would otherwise still merge once
      # the remaining branch conditions were met. Revoke it explicitly.
      #
      # This is defence in depth rather than the only guard. The branch ruleset
      # also stops it, because dismiss_stale_reviews_on_push drops the approval
      # on the unsigned push and required_approving_review_count is 1, so
      # auto-merge can no longer be satisfied. That protection is a ruleset
      # setting this workflow does not own, so do not rely on it here.
      #
      # FAILS CLOSED: `gh pr merge --disable-auto` is a no-op when auto-merge is
      # not enabled, but a genuine API failure must not pass silently, so the
      # step is not tolerated with `|| true`.
      - name: Cancel auto-merge for an unsigned head
        if: steps.signatures.outputs.all-signed != 'true'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "::notice::Revoking any auto-merge enabled by an earlier signed run."
          gh pr merge --disable-auto "$PR_URL"

      - name: Fetch Dependabot metadata
        id: metadata
        if: steps.signatures.outputs.all-signed == 'true'
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-merge minor and patch updates
        if: >-
          steps.signatures.outputs.all-signed == 'true' &&
          (steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
           steps.metadata.outputs.update-type == 'version-update:semver-patch')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
