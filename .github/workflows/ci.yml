name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The lint-debt baseline (`eslint-baseline.json`) records a per-project
      # warning *ceiling*. Any ESLint error fails, and warnings above the
      # ceiling fail; warnings below it pass, and `npm run lint:baseline:bump`
      # locks the improvement in. `--bump` only ever lowers the ceiling, so a
      # regression can't be laundered by re-bumping.
      - name: Lint (baseline gate)
        run: npm run lint:baseline

      - name: Verify lint baseline gate script
        run: npm run test:scripts

      - name: Build layouts (library)
        run: npx nx build layouts

      - name: Verify emitted package contract
        run: npm run package:contract

      - name: Compile strict external Angular 21 consumers
        run: npm run package:consumer

      - name: Build sam-layouts (app)
        run: npx nx build sam-layouts

      - name: Run both Vitest suites and enforce coverage floors
        run: npm run test:coverage

      # The guard script below is the only thing standing between us and
      # another check that is green against nothing, so its own tests run
      # first.
      - name: Verify Storybook story-count guard
        run: node --test scripts/check-storybook-stories.test.mjs

      # `CI=1` is mandatory, not decorative. On a failed build Storybook 8
      # prints an interactive prompt — "Would you like to help improve
      # Storybook by sending anonymous crash reports? (Y/n)" — and then waits
      # forever at 0% CPU. In CI that turns a fast failure into a job that
      # burns to the timeout. GitHub Actions already exports `CI=true`; it is
      # set explicitly here so the step behaves identically when run locally.
      # See GSA/sam-layouts#75.
      - name: Build Storybook (sam-layouts app)
        run: CI=1 npx nx build-storybook sam-layouts

      # `build-storybook` exits 0 on an empty Storybook, which is exactly how
      # `main` shipped `{"v":5,"entries":{}}` unnoticed. A bare successful
      # build is therefore not evidence; the registered entry count is.
      # The floor (34 = 26 stories + 8 docs) is a floor rather than an
      # equality so adding a story does not break CI, and the two subheader
      # titles are pinned by name because they come from two separate files.
      - name: Assert Storybook registered its stories
        run: |
          node scripts/check-storybook-stories.mjs \
            dist/storybook/sam-layouts/index.json \
            --min 34 \
            --require-title 'Subheader' \
            --require-title 'Subheader/Modes'

      - name: Install Chromium for rendered-story verification
        run: npx playwright install --with-deps chromium

      # The index guard proves registration; this step proves that every story
      # creates its expected component DOM without browser/runtime errors.
      - name: Render every Storybook story in Chromium
        run: npm run test:storybook-render

      # CI=1 reuses the artifact above; the Playwright web server probes iframe.html.
      - name: Playwright story smoke gate
        run: npm run test:e2e

      - name: Playwright WCAG 2.1 AA axe gate
        run: npm run test:a11y

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: |
            test-results/e2e/
            test-results/a11y/
            playwright-report/e2e/
            playwright-report/a11y/
          if-no-files-found: warn

      # Stop-the-world formatting gate. Deliberately last: this is a whole-repo
      # mechanical check with no logical dependency on the steps above it, and
      # running it after the substantive build/test/Storybook gates means a
      # real regression fails fast while a pure formatting drift only ever
      # fails at the very end, never masking a functional failure above it.
      # See GSA/sam-layouts#84.
      - name: Format check (Prettier)
        run: npm run format:check

      # Both projects write under separate coverage subdirectories, so the
      # whole tree is uploaded as one artifact.
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error
