name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # TODO: promote this to a blocking step once the lint-debt baseline
      # (121 errors) is cleared by the Wave 2 "ESLint template a11y gate +
      # lint-debt baseline" issue tracked under GSA/sam-layouts#52.
      - name: Lint (non-blocking)
        run: npx nx run-many -t lint
        continue-on-error: true

      - name: Build layouts (library)
        run: npx nx build layouts

      - name: Build sam-layouts (app)
        run: npx nx build sam-layouts

      # `--codeCoverage` is required: without it the Jest executor writes no
      # coverage output at all and the upload step below collects nothing.
      # Verified locally — a plain `nx test layouts` leaves `coverage/` absent.
      - name: Test layouts (library)
        run: npx nx test layouts --codeCoverage

      - name: Test sam-layouts (app)
        run: npx nx test sam-layouts --codeCoverage

      # The guard script below is the only thing standing between us and
      # another check that is green against nothing, so its own tests run
      # first.
      - name: Verify Storybook story-count guard
        run: node --test scripts/check-storybook-stories.test.mjs

      # `CI=1` is mandatory, not decorative. On a failed build Storybook 8
      # prints an interactive prompt — "Would you like to help improve
      # Storybook by sending anonymous crash reports? (Y/n)" — and then waits
      # forever at 0% CPU. In CI that turns a fast failure into a job that
      # burns to the timeout. GitHub Actions already exports `CI=true`; it is
      # set explicitly here so the step behaves identically when run locally.
      # See GSA/sam-layouts#75.
      - name: Build Storybook (sam-layouts app)
        run: CI=1 npx nx build-storybook sam-layouts

      # `build-storybook` exits 0 on an empty Storybook, which is exactly how
      # `main` shipped `{"v":5,"entries":{}}` unnoticed. A bare successful
      # build is therefore not evidence; the registered entry count is.
      # The floor (34 = 26 stories + 8 docs) is a floor rather than an
      # equality so adding a story does not break CI, and the two subheader
      # titles are pinned by name because they come from two separate files.
      - name: Assert Storybook registered its stories
        run: |
          node scripts/check-storybook-stories.mjs \
            dist/storybook/sam-layouts/index.json \
            --min 34 \
            --require-title 'Subheader' \
            --require-title 'Subheader/Modes'

      # Both projects write under `coverage/` but to different subdirectories
      # (`coverage/sam-layouts` for the library, `coverage/apps/sam-layouts`
      # for the demo app), so the whole tree is uploaded as one artifact.
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error
