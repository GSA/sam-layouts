@if (items?.length) {
  <div class="grid-row">
    <div class="grid-col">
      <div class="grid-row">
        <div class="grid-col-auto">
          <sds-pagination
            class="tablet:grid-col display-block margin-top-3 padding-top-3"
            [paginationConfiguration]="top"
            [(page)]="page"
            (pageChange)="paginationChange.next($event)"
            displayMode="results"
            [totalItems]="totalItems"
          >
          </sds-pagination>
        </div>
        <div class="grid-col-fill"></div>
        <div class="grid-col-auto float-right">
          <div class="margin-left-1">
            <label class="usa-label font-sans-3xs text-italic text-base margin-top-1" for="options"> Sort by </label>
            <select
              (change)="onSelectChange()"
              [(ngModel)]="sortField"
              class="usa-select usa-select--small sds-min-width-160 border-base-light"
              id="options"
            >
              @for (item of configuration.sortList; track item) {
                <option [ngValue]="item.value">
                  {{ item.text }}
                </option>
              }
            </select>
          </div>
        </div>
      </div>
    </div>
  </div>
}
<div class="grid-row">
  <div class="grid-col-12">
    @if (!loading) {
      <div>
        @if (templateForDefaultModel && isDefaultModel && !items?.length) {
          <sds-search-result-list
            [model]="items"
            [customResultsTemplate]="templateForDefaultModel"
            [isDefaultModel]="isDefaultModel"
          >
          </sds-search-result-list>
        } @else {
          <sds-search-result-list
            [model]="items"
            [customResultsTemplate]="customResultsTemplate"
            [isDefaultModel]="isDefaultModel"
          >
            <ng-container>
              <ng-template #resultContent let-item>
                <ng-container *ngTemplateOutlet="resultContentTemplate; context: { $implicit: item }"> </ng-container>
              </ng-template>
            </ng-container>
          </sds-search-result-list>
        }
      </div>
    } @else {
      @for (a of loadingArray; track a) {
        <div>
          <hr />
          <div class="grid-container padding-left-0">
            <div class="sds-load grid-row">
              <div class="grid-col-5 sds-load__title"></div>
            </div>
            <div class="sds-load margin-top-1">
              <div class="tablet:grid-col-fill sds-load__element"></div>
            </div>
            <div class="sds-load margin-top-1">
              <div class="grid-col-8 height-4 sds-load__content"></div>
            </div>
          </div>
        </div>
      }
      <hr />
    }
    @if (!loading && items?.length) {
      <sds-pagination [paginationConfiguration]="bottom" [(page)]="page" (pageChange)="paginationChange.next($event)">
      </sds-pagination>
    }
  </div>
</div>
