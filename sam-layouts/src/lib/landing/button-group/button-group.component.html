@for (button of buttons; track button) {
  @if (button.icons) {
    @if (button.clickHandler) {
      <button
        class="display-flex flex-justify-center sds-button width-full margin-bottom-1"
        id="{{ button.id || button.text }}"
        (click)="button.clickHandler()"
      >
        <usa-icon class="margin-right-1 padding-top-1px" [icon]="[button.icons.icon.icon]"></usa-icon>
        <div class="flex-align-self-center">{{ button.text }}</div>
      </button>
    } @else {
      <button
        class="display-flex flex-justify-center sds-button width-full margin-bottom-1"
        id="{{ button.id || button.text }}"
        routerLink="{{ button.url }}"
      >
        <usa-icon class="margin-right-1 padding-top-1px" [icon]="[button.icons.icon.icon]"></usa-icon>
        <div class="flex-align-self-center">{{ button.text }}</div>
      </button>
    }
  } @else {
    @if (button.clickHandler) {
      <button
        class="usa-button width-full margin-bottom-1"
        id="{{ button.id || button.text }}"
        (click)="button.clickHandler()"
      >
        {{ button.text }}
      </button>
    } @else {
      @if (button.external) {
        <a class="usa-button width-full margin-bottom-1" [ngClass]="button.classes" href="{{ button.url }}">{{
          button.text
        }}</a>
      } @else {
        <a class="usa-button width-full margin-bottom-1" [ngClass]="button.classes" routerLink="{{ button.url }}">{{
          button.text
        }}</a>
      }
    }
  }
}
