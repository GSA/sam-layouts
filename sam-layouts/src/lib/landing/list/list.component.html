@if (list.title) {
  <h3 class="sds-list__title">{{ list.title }}</h3>
}
@if (list.intro) {
  <p class="margin-bottom-2" [innerHtml]="list.intro"></p>
}

<ul class="sds-list margin-top-0 margin-bottom-1" [ngClass]="list.classes" [class.sds-list--icon]="list.iconList">
  @for (item of list.items; track item) {
    <li>
      @if (list.iconList) {
        <span class="sds-list__item-icon">
          @if (item.icon.icon) {
            <usa-icon [icon]="item.icon.icon" [classList]="item.icon.classes"> </usa-icon>
          }
        </span>
      }
      <span class="sds-list__item-content">
        @if (item.link) {
          <sds-landing-link [link]="item.link"></sds-landing-link>
        }
        {{ item.text }}
      </span>
    </li>
  }
</ul>
