@if (title || status) {
  <div class="display-flex flex-row flex-align-center">
    @if (title) {
      <h1>{{ title }}</h1>
    }
    @if (status) {
      <span class="sds-tag sds-tag--status padding-left-105 margin-top-1">
        <i class="sds-status sds-status--sm sds-status--{{ status.color }}"></i>
        {{ status.text }}
      </span>
    }
  </div>
}
<ng-content></ng-content>
